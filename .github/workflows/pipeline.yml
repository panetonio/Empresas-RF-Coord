# =============================================================================
# .github/workflows/pipeline.yml
# =============================================================================

name: RFB Pipeline

on:
  workflow_dispatch:
    inputs:
      month:
        description: "Mês de referência (ex: 2025-11) ou 'latest'"
        required: false
        default: "latest"

      outputs:
        description: "Outputs desejados (separados por espaço): municipio cnpj_estab cnpj_empresa"
        required: true
        default: "municipio"

      municipios:
        description: "Códigos IBGE dos municípios (separados por espaço, ex: 5002704 5002472)"
        required: false
        default: ""

      uf:
        description: "UF do arquivo de coordenadas (ex: MS)"
        required: false
        default: ""

      # Agora é o caminho DENTRO do bucket S3 (sem s3://bucket-name/)
      # Exemplo: raw/Auxiliares/inputs/cnpjs.xlsx
      cnpjs_s3_path:
        description: "Caminho do XLSX de CNPJs no S3 (ex: raw/Auxiliares/inputs/cnpjs.xlsx)"
        required: false
        default: "raw/Auxiliares/inputs/cnpjs.xlsx"

      # Pasta dos arquivos coord_{UF}.parquet dentro do bucket
      coords_s3_dir:
        description: "Pasta dos coords no S3 (ex: raw/Auxiliares/coordenadas)"
        required: false
        default: "raw/Auxiliares/coordenadas"

      # Pasta de destino dos outputs dentro do bucket
      output_s3_dir:
        description: "Pasta de destino dos outputs no S3 (ex: raw/outputs)"
        required: false
        default: "raw/outputs"

      max_parallel:
        description: "Máximo de downloads simultâneos (padrão: 2)"
        required: false
        default: "2"

      no_nominatim:
        description: "Desabilitar Nominatim? (true/false)"
        required: false
        default: "true"

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------------
      - name: Checkout do repositório
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # ------------------------------------------------------------------
      - name: Instalar dependências Python
        run: pip install -r requirements.txt

      # ------------------------------------------------------------------
      # Configura as credenciais AWS para todos os passos seguintes.
      # Os valores vêm dos Secrets que você cadastrou no GitHub.
      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      # ------------------------------------------------------------------
      - name: Criar diretórios locais de trabalho
        run: mkdir -p /tmp/rfb_data/coords

      # ------------------------------------------------------------------
      # Mesma lógica de antes:
      # - cnpj_estab → baixa TODOS os coord_*.parquet (qualquer UF pode aparecer)
      # - municipio  → baixa só o coord_{UF}.parquet necessário
      - name: Baixar arquivos de coordenadas do S3
        run: |
          OUTPUTS="${{ inputs.outputs }}"
          UF="${{ inputs.uf }}"
          BUCKET="${{ secrets.AWS_S3_BUCKET }}"
          COORDS_DIR="${{ inputs.coords_s3_dir }}"

          if echo "$OUTPUTS" | grep -qw "cnpj_estab"; then
            echo "[INFO] cnpj_estab solicitado — baixando todos os arquivos de coords..."
            aws s3 sync \
              "s3://${BUCKET}/${COORDS_DIR}/" \
              /tmp/rfb_data/coords/ \
              --exclude "*" \
              --include "coord_*.parquet"
          elif [ -n "$UF" ]; then
            echo "[INFO] Baixando coord_${UF}.parquet..."
            aws s3 cp \
              "s3://${BUCKET}/${COORDS_DIR}/coord_${UF}.parquet" \
              /tmp/rfb_data/coords/coord_${UF}.parquet
          fi

          echo "[INFO] Arquivos de coords disponíveis:"
          ls /tmp/rfb_data/coords/ || echo "(nenhum)"

      # ------------------------------------------------------------------
      - name: Baixar XLSX de CNPJs do S3
        if: ${{ inputs.cnpjs_s3_path != '' }}
        run: |
          BUCKET="${{ secrets.AWS_S3_BUCKET }}"
          aws s3 cp \
            "s3://${BUCKET}/${{ inputs.cnpjs_s3_path }}" \
            /tmp/rfb_data/cnpjs.xlsx

      # ------------------------------------------------------------------
      - name: Executar pipeline
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          MUNICIPIOS_ARG=""
          if [ -n "${{ inputs.municipios }}" ]; then
            MUNICIPIOS_ARG="--municipios ${{ inputs.municipios }}"
          fi

          UF_ARG=""
          if [ -n "${{ inputs.uf }}" ]; then
            UF_ARG="--uf ${{ inputs.uf }}"
          fi

          CNPJS_ARG=""
          if [ -n "${{ inputs.cnpjs_s3_path }}" ]; then
            CNPJS_ARG="--cnpjs-file /tmp/rfb_data/cnpjs.xlsx"
          fi

          NO_NOMINATIM_ARG=""
          if [ "${{ inputs.no_nominatim }}" = "true" ]; then
            NO_NOMINATIM_ARG="--no-nominatim"
          fi

          set -e
          python pipeline.py \
            --month      "${{ inputs.month }}" \
            --outputs    ${{ inputs.outputs }} \
            --base-dir   /tmp/rfb_data \
            --coords-dir /tmp/rfb_data/coords \
            --max-parallel "${{ inputs.max_parallel }}" \
            $MUNICIPIOS_ARG \
            $UF_ARG \
            $CNPJS_ARG \
            $NO_NOMINATIM_ARG

          echo "===== Arquivos gerados em /tmp/rfb_data ====="
          find /tmp/rfb_data/ -type f | head -100

      # ------------------------------------------------------------------
      - name: Verificar se outputs foram criados
        if: success()
        run: |
          MONTH="${{ inputs.month }}"
          if [ "$MONTH" = "latest" ]; then
            MONTH=$(find /tmp/rfb_data/ -maxdepth 1 -type d -name '[0-9][0-9][0-9][0-9]-[0-9][0-9]' | sort | tail -1 | xargs basename)
          fi

          echo "Mês definido: $MONTH"
          OUTPUT_PATH="/tmp/rfb_data/${MONTH}/outputs"

          if [ ! -d "$OUTPUT_PATH" ]; then
            echo "[ERROR] Outputs não foram criados!"
            exit 1
          else
            echo "[SUCCESS] Outputs encontrados em: $OUTPUT_PATH"
          fi

      # ------------------------------------------------------------------
      - name: Sincronizar outputs para o S3
        if: success()
        run: |
          MONTH="${{ inputs.month }}"
          if [ "$MONTH" = "latest" ]; then
            MONTH=$(find /tmp/rfb_data/ -maxdepth 1 -type d -name '[0-9][0-9][0-9][0-9]-[0-9][0-9]' | sort | tail -1 | xargs basename)
          fi

          if [ -z "$MONTH" ]; then
            echo "[ERROR] Não foi possível determinar o mês."
            ls -la /tmp/rfb_data/
            exit 1
          fi

          OUTPUT_PATH="/tmp/rfb_data/${MONTH}/outputs"
          BUCKET="${{ secrets.AWS_S3_BUCKET }}"
          DEST="s3://${BUCKET}/${{ inputs.output_s3_dir }}/${MONTH}"

          echo "[INFO] Enviando ${OUTPUT_PATH} para ${DEST}..."
          aws s3 sync "$OUTPUT_PATH" "$DEST"
          echo "[SUCCESS] Upload concluído!"
